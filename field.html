<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldwork | Saqib</title>
  <link rel="icon" type="image/png" href="photo/icon.png">

  <!-- Font: Jost -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link href="styles.css" rel="stylesheet">
  <!-- Coverflow gallery CSS -->
  <link href="templatemo-3d-coverflow.css" rel="stylesheet">
</head>
<body>

  <!-- Header placeholder -->
  <div id="header-placeholder"></div>

  <!-- Custom cursor -->
  <div class="cursor"></div>

  <!-- Theme toggle button -->
  <button id="themeToggle" type="button" onclick="toggleTheme()" aria-label="Switch to dark theme">🌙</button>

  <!--
    To add / change a picture:
    1. put the image in the images/ folder
    2. copy one coverflow-item block below and set img src + alt
    3. set data-title and data-description (shown above the gallery)
  -->
  <section id="home" class="section">
    <div class="coverflow-wrapper">
      <div class="info">
        <h2 id="current-title"></h2>
        <p id="current-description"></p>
      </div>

      <div class="coverflow-container" tabindex="0" aria-label="Fieldwork photo gallery (use arrow keys)">
        <div class="coverflow" id="coverflow">

          <div class="coverflow-item" data-title="Afghan Refugees" data-description="Refugee Camps">
            <div class="cover image-loading">
              <img src="images/afghan_refugee1.jpg" alt="Afghan refugees in Pakistan" loading="lazy">
            </div>
            <div class="reflection"></div>
          </div>

          <div class="coverflow-item" data-title="Afghan Refugees" data-description="Refugee Camps">
            <div class="cover image-loading">
              <img src="images/afghan_refugee2.jpg" alt="Afghan refugees in Pakistan" loading="lazy">
            </div>
            <div class="reflection"></div>
          </div>

          <div class="coverflow-item" data-title="Afghan Refugees" data-description="Refugee Camps">
            <div class="cover image-loading">
              <img src="images/afghan_refugee3.jpg" alt="Afghan refugees in Pakistan" loading="lazy">
            </div>
            <div class="reflection"></div>
          </div>

          <div class="coverflow-item" data-title="Afghan Refugees" data-description="Refugee Camps">
            <div class="cover image-loading">
              <img src="images/afghan_refugee4.jpg" alt="Afghan refugees in Pakistan" loading="lazy">
            </div>
            <div class="reflection"></div>
          </div>

          <div class="coverflow-item" data-title="Afghan Refugees" data-description="Refugee Camps">
            <div class="cover image-loading">
              <img src="images/afghan_refugee5.jpg" alt="Afghan refugees in Pakistan" loading="lazy">
            </div>
            <div class="reflection"></div>
          </div>

          <div class="coverflow-item" data-title="LRMIS" data-description="Land Record Data Collection">
            <div class="cover image-loading">
              <img src="images/lrmis1.jpeg" alt="Land record data collection (LRMIS)" loading="lazy">
            </div>
            <div class="reflection"></div>
          </div>

          <div class="coverflow-item" data-title="LRMIS" data-description="Land Record Data Collection">
            <div class="cover image-loading">
              <img src="images/lrmis2.jpeg" alt="Land record data collection (LRMIS)" loading="lazy">
            </div>
            <div class="reflection"></div>
          </div>

        </div>

        <button class="nav-button prev" type="button" aria-label="Previous photo">‹</button>
        <button class="nav-button next" type="button" aria-label="Next photo">›</button>

        <div class="dots-container" id="dots"></div>

        <!-- Play/Pause Button -->
        <button class="play-pause-button" id="playPauseBtn" type="button" aria-label="Play or pause slideshow">
          <span class="play-icon">▶</span>
          <span class="pause-icon" style="display: none;">❚❚</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Scroll to top button -->
  <div class="scroll-to-top" id="scrollToTop" role="button" aria-label="Scroll to top">
    <span>↑</span>
  </div>

  <!-- Scripts -->
  <script src="scripts.js" defer></script>
  <script src="templatemo-3d-coverflow-scripts.js" defer></script>
</body>
</html>
