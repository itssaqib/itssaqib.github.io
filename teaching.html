<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teaching | Saqib</title>
  <link rel="icon" type="image/png" href="photo/icon.png">

  <!-- Font: Jost -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link href="styles.css" rel="stylesheet">
  <link href="pages.css" rel="stylesheet">
</head>
<body>

  <!-- Header placeholder -->
  <div id="header-placeholder"></div>

  <!-- Custom cursor -->
  <div class="cursor"></div>

  <!-- Theme toggle button -->
  <button id="themeToggle" type="button" onclick="toggleTheme()" aria-label="Switch to dark theme">🌙</button>

  <main class="page">

    <!-- Intro -->
    <div class="page-intro">
      <p>Econometrics, impact evaluation, and research skills for graduate students and policy professionals.</p>
    </div>

    <!-- Course content lives in teaching/*.html -->
    <div class="teach-grid">
      <section class="block">
        <h2>Instructor</h2>
        <div class="timeline" id="instructor" data-include="teaching/instructor.html"></div>
      </section>

      <section class="block">
        <h2>Teaching Assistant</h2>
        <div class="timeline" id="teaching_assistant" data-include="teaching/teaching_assistant.html"></div>
      </section>
    </div>

  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="scripts.js" defer></script>
  <script src="pages.js" defer></script>
</body>
</html>
